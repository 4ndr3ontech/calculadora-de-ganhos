<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 410 122" width="410" height="122">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="greenUp" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- SÍMBOLO / ÍCONE DA MARCA (Super imponente: 116x116) -->
  <g transform="translate(7, 7)">
    <rect x="0" y="0" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5" />
    
    <!-- Visor da Calculadora -->
    <rect x="26" y="21" width="64" height="24" rx="6" fill="#e0f2fe" opacity="0.95" />
    <rect x="32" y="27" width="32" height="5" rx="2.5" fill="#0284c7" opacity="0.75" />
    
    <!-- Teclas da Calculadora em Grid -->
    <rect x="26" y="54" width="15" height="13" rx="3" fill="url(#neonCyan)" opacity="0.85" />
    <rect x="50" y="54" width="15" height="13" rx="3" fill="url(#neonCyan)" opacity="0.85" />
    <rect x="74" y="54" width="15" height="13" rx="3" fill="url(#neonCyan)" opacity="0.85" />

    <rect x="26" y="73" width="15" height="13" rx="3" fill="url(#neonCyan)" opacity="0.6" />
    <rect x="50" y="73" width="15" height="13" rx="3" fill="url(#neonCyan)" opacity="0.6" />
    
    <!-- Seta de Crescimento / Ganho sobreposta com destaque verde -->
    <path d="M 48 95 L 72 71 L 87 71 L 87 88" fill="none" stroke="url(#greenUp)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />
    <path d="M 69 69 L 90 69 L 90 90" fill="none" stroke="url(#greenUp)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- TIPOGRAFIA E TEXTOS DO LOGOTIPO (Fontes bem grandes e expressivas) -->
  <g transform="translate(142, 0)">
    <!-- Palavra 1: Calculadora -->
    <text x="0" y="54" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="44" font-weight="700" fill="#0f172a" letter-spacing="-1">Calculadora</text>
    
    <!-- Palavra 2 & 3: de Ganhos -->
    <text x="0" y="94" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="38" font-weight="500" fill="#64748b" letter-spacing="-0.5">de <tspan font-weight="700" fill="#0284c7">Ganhos</tspan></text>
    
    <!-- Tagline Profissional / Slogan -->
    <text x="2" y="118" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="4">SIMULE • PLANEJE • EVOLUA</text>
  </g>
</svg>