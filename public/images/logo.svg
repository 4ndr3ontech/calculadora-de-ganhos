<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 72" width="256" height="72" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#033b2c" />
      <stop offset="100%" stop-color="#02241b" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="34" y1="54" x2="58" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
  </defs>

  <!-- Ícone da Calculadora ajustado rente à borda esquerda, superior e inferior -->
  <g transform="translate(2, 2)">
    <rect width="68" height="68" rx="16" fill="url(#iconBg)" stroke="#a7f3d0" stroke-opacity="0.28" stroke-width="1.5" />
    
    <!-- Visor -->
    <rect x="14" y="13" width="40" height="13" rx="4" fill="#ecfdf5" />
    <rect x="36" y="17" width="13" height="5" rx="2" fill="#065f46" />

    <!-- Teclas -->
    <rect x="14" y="32" width="10" height="8" rx="2.5" fill="#6ee7b7" fill-opacity="0.85" />
    <rect x="29" y="32" width="10" height="8" rx="2.5" fill="#6ee7b7" fill-opacity="0.85" />
    <rect x="14" y="45" width="10" height="8" rx="2.5" fill="#6ee7b7" fill-opacity="0.85" />

    <!-- Seta de Crescimento / Ganhos em Dourado -->
    <path d="M29 52 L40 42 L46 46 L55 36" stroke="url(#arrowGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M47 35 H56 V44" stroke="url(#arrowGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tipografia da Marca rente ao ícone e à borda direita -->
  <text x="80" y="31" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.6" fill="#ffffff">
    Calculadora
  </text>

  <text x="80" y="55" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="23" font-weight="500" fill="#a7f3d0">
    de
    <tspan font-weight="800" fill="#fbbf24" dx="3">Ganhos</tspan>
  </text>

  <!-- Slogan -->
  <text x="81" y="69" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.1" fill="#6ee7b7">
    SIMULE • PLANEJE • EVOLUA
  </text>
</svg>